[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "happy_customers"
version = "0.0.1"
description = "This project creates a predictive model for customer happiness, based on their answers to 6 survey questions. One goal is to propose questions that can be cut (unimportant features) and questions that should remain (important features)"
authors = [
  { name = "Christian" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipykernel>=7.4.0",
    "ipython",
    "jupyterlab",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "seaborn>=0.13.2",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["happy_customers"]
include = ["pyproject.toml", "happy_customers/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["happy_customers"]
force-sort-within-sections = true

